services:
  pokget_app:
    container_name: pokget_test_app
    environment:
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      TRUST_CLOUDFLARE: "false"
      CATALOG_ENABLED: "false"
      CATALOG_IMAGES_ENABLED: "false"
      RATE_LIMIT: "100"
      BURST_LIMIT: "200"
      SCAN_RATE_LIMIT: "100"
      SCAN_BURST_LIMIT: "200"
    volumes:
      - pokget_test_cache:/app/data/cache
      - pokget_test_catalog_images:/app/data/catalog-images
    ports: !override
      - "18066:18066"

  pokget_db:
    container_name: pokget_test_db
    ports: !override
      - "5434:5432"
    volumes:
      - pokget_test_postgres:/var/lib/postgresql/data

  pokget_ollama:
    container_name: pokget_test_ollama
    ports: !override
      - "11435:11434"

volumes:
  pokget_test_cache:
  pokget_test_catalog_images:
  pokget_test_postgres:
