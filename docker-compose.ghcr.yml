services:
  pokget_app:
    container_name: pokget_app
    image: ghcr.io/arumes31/pokget:latest
    ports:
      - "${APP_PORT:-18066}:${APP_PORT:-18066}"
    environment:
      - APP_NAME=${APP_NAME:-Pokget}
      - APP_PORT=${APP_PORT:-18066}
      - DEBUG=${DEBUG:-false}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - RATE_LIMIT=${RATE_LIMIT:-20}
      - BURST_LIMIT=${BURST_LIMIT:-50}
      - WRITE_TIMEOUT=${WRITE_TIMEOUT:-120}
      - SCAN_RATE_LIMIT=${SCAN_RATE_LIMIT:-5}
      - SCAN_BURST_LIMIT=${SCAN_BURST_LIMIT:-10}
      - DB_HOST=pokget_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-pokget_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-pokget_db}
      - DB_SSLMODE=disable
      - CLAUDE_ENABLED=${CLAUDE_ENABLED:-true}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5-5}
      - CLAUDE_BASE_URL=${CLAUDE_BASE_URL:-https://api.anthropic.com/v1/messages}
      - CLAUDE_TIMEOUT_SECONDS=${CLAUDE_TIMEOUT_SECONDS:-30}
      - CLAUDE_PROMPT_CACHING=${CLAUDE_PROMPT_CACHING:-true}
      - SCAN_TIMEOUT_SECONDS=${SCAN_TIMEOUT_SECONDS:-75}
      - SCAN_OCR_POOL_SIZE=${SCAN_OCR_POOL_SIZE:-3}
      - SCAN_PHASH_HIGH_CONF=${SCAN_PHASH_HIGH_CONF:-5}
      - SCAN_PHASH_POTENTIAL=${SCAN_PHASH_POTENTIAL:-10}
      - SCAN_VISION_OCR_ENABLED=${SCAN_VISION_OCR_ENABLED:-false}
      - OMP_THREAD_LIMIT=${OMP_THREAD_LIMIT:-1}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API=${LLM_API:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      - SESSION_KEY=${SESSION_KEY}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-no-reply@pokget.com}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - TRUST_CLOUDFLARE=${TRUST_CLOUDFLARE:-false}
      - CATALOG_ENABLED=${CATALOG_ENABLED:-true}
      - LEGACY_METADATA_SYNC_ENABLED=${LEGACY_METADATA_SYNC_ENABLED:-false}
      - CATALOG_LANGUAGE=${CATALOG_LANGUAGE:-en,de,ja,fr,zh-cn,zh-tw,ko}
      - CATALOG_SYNC_INTERVAL_MINUTES=${CATALOG_SYNC_INTERVAL_MINUTES:-360}
      - CATALOG_BATCH_SIZE=${CATALOG_BATCH_SIZE:-500}
      - CATALOG_REQUEST_DELAY_MS=${CATALOG_REQUEST_DELAY_MS:-100}
      - CATALOG_WEISS_MAX_PAGES=${CATALOG_WEISS_MAX_PAGES:-0}
      - CATALOG_IMAGES_ENABLED=${CATALOG_IMAGES_ENABLED:-true}
      - CATALOG_IMAGE_STORE=/app/data/catalog-images
      - CATALOG_IMAGE_BATCH_SIZE=${CATALOG_IMAGE_BATCH_SIZE:-8}
      - CATALOG_IMAGE_CONCURRENCY=${CATALOG_IMAGE_CONCURRENCY:-4}
      - CATALOG_IMAGE_POLL_INTERVAL_MS=${CATALOG_IMAGE_POLL_INTERVAL_MS:-5000}
      - PRICE_SYNC_INTERVAL_MINUTES=${PRICE_SYNC_INTERVAL_MINUTES:-60}
      - METADATA_TARGETS=${METADATA_TARGETS:-pokemon:en}
      - WORKER_REQUESTS_PER_SECOND=${WORKER_REQUESTS_PER_SECOND:-0.5}
      - WORKER_REQUEST_BURST=${WORKER_REQUEST_BURST:-1}
      - WORKER_RETRY_ATTEMPTS=${WORKER_RETRY_ATTEMPTS:-3}
      - WORKER_RETRY_BASE_DELAY_MS=${WORKER_RETRY_BASE_DELAY_MS:-1000}
      - WORKER_CIRCUIT_FAILURES=${WORKER_CIRCUIT_FAILURES:-3}
      - WORKER_CIRCUIT_COOLDOWN_SECONDS=${WORKER_CIRCUIT_COOLDOWN_SECONDS:-300}
      - WORKER_MAX_PRICE_RATIO=${WORKER_MAX_PRICE_RATIO:-5}
      - PRICE_HISTORY_RETENTION_DAYS=${PRICE_HISTORY_RETENTION_DAYS:-730}
      - WORKER_FAILURE_PATH=/app/data/cache/worker-failures.jsonl
    depends_on:
      pokget_db:
        condition: service_healthy
    volumes:
      - ./data/cache:/app/data/cache
      - ./data/catalog-images:/app/data/catalog-images
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777

  pokget_db:
    container_name: pokget_db
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      - POSTGRES_USER=${DB_USER:-pokget_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-pokget_db}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Loopback only: native tools on this host can reach it; the app uses
      # the internal Compose network.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 stores cluster data under /var/lib/postgresql/18/docker.
      # Note: Upgrading an existing database volume from PG15 requires pg_upgrade or pg_dump/restore.
      - ./data/postgres:/var/lib/postgresql
