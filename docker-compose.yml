services:
  pokget_app:
    container_name: pokget_app
    build: .
    ports:
      - "${APP_PORT:-18066}:${APP_PORT:-18066}"
    environment:
      - APP_PORT=${APP_PORT:-18066}
      - DB_HOST=pokget_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-pokget_user}
      - DB_PASSWORD=${DB_PASSWORD:-pokget_pass}
      - DB_NAME=${DB_NAME:-pokget_db}
      - DB_SSLMODE=disable
      - OLLAMA_HOST=pokget_ollama
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
      - SESSION_KEY=${SESSION_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-no-reply@pokget.com}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - TRUST_CLOUDFLARE=${TRUST_CLOUDFLARE:-false}
      - CATALOG_ENABLED=${CATALOG_ENABLED:-true}
      - LEGACY_METADATA_SYNC_ENABLED=${LEGACY_METADATA_SYNC_ENABLED:-false}
      - CATALOG_LANGUAGE=${CATALOG_LANGUAGE:-en}
      - CATALOG_SYNC_INTERVAL_MINUTES=${CATALOG_SYNC_INTERVAL_MINUTES:-360}
      - CATALOG_BATCH_SIZE=${CATALOG_BATCH_SIZE:-500}
      - CATALOG_REQUEST_DELAY_MS=${CATALOG_REQUEST_DELAY_MS:-100}
      - CATALOG_IMAGES_ENABLED=${CATALOG_IMAGES_ENABLED:-true}
      - CATALOG_IMAGE_STORE=/app/data/catalog-images
      - CATALOG_IMAGE_BATCH_SIZE=${CATALOG_IMAGE_BATCH_SIZE:-8}
      - CATALOG_IMAGE_POLL_INTERVAL_MS=${CATALOG_IMAGE_POLL_INTERVAL_MS:-5000}
    depends_on:
      pokget_db:
        condition: service_healthy
      pokget_ollama:
        condition: service_started
    volumes:
      - ./data/cache:/app/data/cache
      - ./data/catalog-images:/app/data/catalog-images

  pokget_db:
    container_name: pokget_db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-pokget_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pokget_pass}
      - POSTGRES_DB=${DB_NAME:-pokget_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  pokget_ollama:
    container_name: pokget_ollama
    image: ollama/ollama:0.32.3
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
