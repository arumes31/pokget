name: Catalog Source Health

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: source (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source:
          - tcgdex
          - scryfall
          - onepiece_official
          - lorcanajson
          - weiss_official
          - ygoprodeck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - name: Validate live provider contract
        env:
          POKGET_CATALOG_SOURCE: ${{ matrix.source }}
        run: >-
          go test -tags=integration -count=1
          -run '^TestDefaultProvidersLive$'
          -timeout=5m -v ./internal/catalog/source
