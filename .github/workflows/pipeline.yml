name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to build Docker image from
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.inputs.target_branch || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Install Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run Go tests
        run: go test -timeout=10m -count=1 ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service
            packages: ./internal/service
          - name: catalog-workers
            packages: ./internal/catalog ./internal/catalog/source ./internal/worker
          - name: handlers-auth
            packages: ./internal/auth ./internal/handlers ./internal/middleware
          - name: database-main
            packages: ./internal/db ./cmd/pokget
    name: race (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Install Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run bounded race shard
        run: go test -race -timeout=8m -count=1 ${{ matrix.packages }}

  ocr-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Install Tesseract runtime and development data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev pkg-config
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Exercise real Tesseract OCR
        env:
          CGO_ENABLED: "1"
        run: go test -tags=ocrintegration -run '^TestTesseractRecognizesSyntheticCardName$' -timeout=2m -count=1 -v ./internal/service

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Resolve Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::Chrome or Chromium is not installed on the runner"
            exit 1
          fi
          printf 'POKGET_CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Run rendered mobile and service-worker tests
        run: go test -timeout=3m -count=1 -v ./cmd/ui_scan_test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Install Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install and run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          export CGO_ENABLED=1
          $(go env GOPATH)/bin/golangci-lint run ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Install Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          export CGO_ENABLED=1
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          export CGO_ENABLED=1
          $(go env GOPATH)/bin/gosec ./...

  js-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test static asset builder
        run: npm run test:static
      - name: Build and validate minified JavaScript
        run: |
          npm run build:static
          npm run check:static

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false
      - name: Build production image
        run: docker build --tag pokget:verification .
      - name: Verify runtime, migrations, and backup restore
        run: bash scripts/container-smoke.sh pokget:verification

  docker:
    needs: [test, race, ocr-integration, browser, lint, security, js-assets, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref }}
          persist-credentials: false

      - name: Resolve checked-out source
        id: source
        shell: bash
        run: |
          ref_name="$(git branch --show-current)"
          if [[ -z "$ref_name" ]]; then
            echo "::error::target_branch must resolve to a branch"
            exit 1
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'ref_name=%s\n' "$ref_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.source.outputs.ref_name }}
            type=raw,value=sha-${{ steps.source.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.source.outputs.ref_name == 'main' }}

      - name: Build minified assets and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pokget
          cache-to: type=gha,mode=max,scope=pokget
