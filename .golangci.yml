version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -QF*
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: ^cmd/(detection_fixtures|detection_matrix|detection_seed|fingerprint_diagnostics|generate_crops|llm_benchmark|populate_fingerprints|ui_scan_test)/
        linters:
          - staticcheck
          - unused

issues:
  max-issues-per-linter: 50
  max-same-issues: 50
