<div class="flex flex-col space-y-6"
    x-data="{
        myOffer: 0,
        myCard: '',
        myPortfolioId: '',
        theirOffer: 0,
        theirCards: '',
        downloadLog() {
            const difference = Number(this.theirOffer || 0) - Number(this.myOffer || 0);
            const text = [
                'Pokget Trade Log',
                'Generated: ' + new Date().toISOString(),
                'My card: ' + this.myCard,
                'Portfolio item: ' + this.myPortfolioId,
                'My offer: {{ .CurrencySymbol }}' + Number(this.myOffer || 0).toFixed(2),
                'Their offer: {{ .CurrencySymbol }}' + Number(this.theirOffer || 0).toFixed(2),
                'Difference: {{ .CurrencySymbol }}' + difference.toFixed(2),
                'Their cards / notes: ' + (this.theirCards || 'Not specified'),
                'This log is downloaded locally and is not stored by Pokget.'
            ].join('\n');
            const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = 'pokget-trade-' + new Date().toISOString().slice(0, 10) + '.txt';
            link.click();
            URL.revokeObjectURL(url);
            $dispatch('notify', { msg: 'Trade log downloaded', type: 'success' });
        }
    }">
    <div>
        <h2 class="text-xl font-bold">Trade Analyzer</h2>
        <p class="mt-1 text-xs text-white/50">Compare current market values and download a private, non-persisted trade log.</p>
    </div>

    <div class="glass-card space-y-4 rounded-2xl p-5 border-emerald-500/20">
        <label for="my-trade-card" class="block text-[10px] font-bold uppercase tracking-widest text-emerald-300">My card</label>
        <select id="my-trade-card" x-model="myPortfolioId"
            @change="myOffer = Number($event.target.selectedOptions[0].dataset.price || 0); myCard = $event.target.selectedOptions[0].dataset.label || ''"
            class="w-full rounded-xl border border-white/10 bg-surface px-4 py-3 text-sm">
            <option value="" data-price="0" data-label="">Select from your collection</option>
            {{ range .Portfolio }}
            <option value="{{ .ID }}"
                data-price="{{ if eq $.UserCurrency "EUR" }}{{ .Card.PriceEUR }}{{ else }}{{ .Card.PriceUSD }}{{ end }}"
                data-label="{{ .Card.Name }} — {{ .Card.Set }} ({{ .Condition }})">
                {{ .Card.Name }} — {{ .Card.Set }} ({{ .Condition }})
            </option>
            {{ end }}
        </select>
        <p class="text-right text-lg font-bold text-emerald-300" x-text="'{{ .CurrencySymbol }}' + Number(myOffer).toFixed(2)"></p>
    </div>

    <div class="glass-card space-y-4 rounded-2xl p-5 border-blue-500/20">
        <label for="their-offer" class="block text-[10px] font-bold uppercase tracking-widest text-blue-300">Their offer value</label>
        <input id="their-offer" type="number" min="0" step="0.01" x-model.number="theirOffer"
            class="w-full rounded-xl border border-white/10 bg-surface px-4 py-3 text-sm">
        <label for="their-cards" class="block text-[10px] font-bold uppercase tracking-widest text-blue-300">Cards / notes</label>
        <textarea id="their-cards" rows="3" x-model="theirCards" placeholder="Card names, conditions, or deal notes"
            class="w-full rounded-xl border border-white/10 bg-surface px-4 py-3 text-sm"></textarea>
    </div>

    <div class="glass-card rounded-2xl p-6" role="region" aria-labelledby="trade-verdict-title">
        <h3 id="trade-verdict-title" class="text-sm font-bold">Trade Verdict</h3>
        <p class="mt-3 text-sm text-white/70"
            x-text="Number(theirOffer) === Number(myOffer) ? 'Even market value' : (Number(theirOffer) > Number(myOffer) ? 'In your favor by ' : 'Against you by ') + '{{ .CurrencySymbol }}' + Math.abs(Number(theirOffer) - Number(myOffer)).toFixed(2)"></p>
        <button type="button" @click="downloadLog()" :disabled="!myPortfolioId || Number(myOffer) <= 0 || Number(theirOffer) <= 0"
            class="mt-5 w-full rounded-xl bg-primary py-3 text-xs font-bold text-on-primary disabled:cursor-not-allowed disabled:opacity-40">
            DOWNLOAD TRADE LOG
        </button>
    </div>
</div>
