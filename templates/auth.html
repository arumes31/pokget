<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/static/js/i18n.js?v={{ .BuildVersion }}" defer></script>
    <script src="/static/js/theme.js?v={{ .BuildVersion }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n>Pokget | Sign in</title>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{ .BuildVersion }}">
    <script src="/static/js/alpine.min.js?v={{ .BuildVersion }}" defer></script>
    <script src="/static/js/htmx.min.js?v={{ .BuildVersion }}"></script>
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png?v={{ .BuildVersion }}">
    <link rel="stylesheet" href="/static/css/styles.css?v={{ .BuildVersion }}">
    <link rel="stylesheet" href="/static/css/auth.css?v={{ .BuildVersion }}">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="/static/manifest.json?v={{ .BuildVersion }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pokget">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v={{ .BuildVersion }}', { scope: '/' })
                    .catch((error) => console.warn('Service worker registration failed', error));
            });
        }
    </script>
</head>

<body class="auth-page">
    <main id="main-content" class="auth-main">
        {{template "auth_fragment.html" .}}
    </main>

    <!-- Notification Toast -->
    <div x-data="{ show: false, msg: '', type: 'info' }"
        @notify.window="show = true; msg = $event.detail.msg; type = $event.detail.type; setTimeout(() => show = false, 3000)"
        x-show="show" x-transition x-cloak
        class="fixed bottom-6 inset-x-4 z-50 flex justify-center pointer-events-none">
        <div class="card px-4 py-3 shadow-lg"
            :class="type === 'error' ? 'border-red-500' : 'border-red-500/40'">
            <p data-i18n class="text-sm font-semibold text-zinc-100" role="status" x-text="msg"></p>
        </div>
    </div>
</body>

</html>
