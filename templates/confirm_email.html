<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/static/js/i18n.js?v={{ .BuildVersion }}" defer></script>
    <script src="/static/js/theme.js?v={{ .BuildVersion }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n>Verify your email | Pokget</title>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{ .BuildVersion }}">
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
    <link rel="icon" type="image/png" href="/static/img/favicon-32.png">
    <script src="/static/js/htmx.min.js?v=3"></script>
</head>

<body
    class="min-h-dvh bg-paper text-zinc-900 dark:text-zinc-100 flex items-center justify-center px-4 py-8"
    style="padding-top: max(2rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom))">

    <div class="w-full max-w-md">
        <div id="confirm-content" class="card p-6 sm:p-10 text-center">
            <img data-i18n-attrs="alt" src="/static/img/logo-128.webp" alt="Pokget" class="w-16 h-16 mx-auto mb-4">

            <h1 data-i18n class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-3">One last step</h1>
            <p data-i18n class="text-sm sm:text-base text-zinc-500 dark:text-zinc-400 mb-8 leading-relaxed">
                Confirm this link to activate your account and secure your collection.
            </p>

            <form hx-post="/auth/confirm" hx-target="#confirm-content" hx-swap="outerHTML">
                <input type="hidden" name="token" value="{{.Token}}">
                <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

                <button data-i18n type="submit" class="btn-primary w-full min-h-12 text-base">
                    Verify my account
                </button>
            </form>
        </div>
    </div>
</body>

</html>

{{define "confirm_success"}}
<div id="confirm-content" class="card p-6 sm:p-10 text-center">
    <div class="w-16 h-16 bg-emerald-100 dark:bg-emerald-950 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-emerald-600 dark:text-emerald-300 text-3xl">verified_user</span>
    </div>
    <h2 data-i18n class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-3">Identity Verified</h2>
    <p data-i18n class="text-sm sm:text-base text-zinc-500 dark:text-zinc-400 mb-8">
        Your account is active. Welcome to Pokget.
    </p>
    <a data-i18n href="/auth" class="btn-primary w-full min-h-12">Sign in</a>
</div>
{{end}}
