<div class="w-full max-w-md mx-auto flex flex-col justify-center py-8"
    x-data="{ resendDisabled: false, countdown: 0 }">
    <div class="card p-6 sm:p-8 text-center">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="text-emerald-600">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold mb-2">Success!</h2>
        <p class="text-sm text-zinc-500 mb-6">{{.Message}}</p>

        <a href="/auth" class="btn-primary w-full min-h-12">Return to login</a>

        <div class="pt-6 mt-6 border-t border-zinc-200">
            <p class="text-xs text-zinc-500 mb-2">Didn't get the email?</p>
            <button @click="
                if (!resendDisabled) {
                    resendDisabled = true;
                    countdown = 300;
                    let timer = setInterval(() => {
                        countdown--;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            resendDisabled = false;
                        }
                    }, 1000);
                    $dispatch('notify', { msg: 'Please go back to sign up to resend.', type: 'info' });
                }"
                :disabled="resendDisabled"
                class="btn-ghost text-violet-700 text-sm">
                <span>Resend verification email</span>
            </button>
        </div>
    </div>
</div>
