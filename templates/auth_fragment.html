<div class="w-full max-w-md mx-auto"
    x-data="{ mode: 'login', signupAttempted: false, resendDisabled: false, countdown: 0 }">
    <!-- Brand -->
    <div class="text-center mb-6">
        <img src="/static/img/logo.png" alt="Pokget" class="w-16 h-16 mx-auto mb-3">
        <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900">Pokget</h1>
        <p class="text-sm text-zinc-500 mt-1">Your collection, in your pocket.</p>
    </div>

    <div class="card p-5 sm:p-8">
        <!-- Mode tabs -->
        <div class="grid grid-cols-2 gap-1 p-1 mb-6 bg-zinc-100 rounded-xl" role="tablist"
            aria-label="Account access">
            <button type="button" role="tab" aria-controls="login-panel"
                :aria-selected="(mode === 'login').toString()"
                @click="mode = 'login'; signupAttempted = false"
                class="min-h-11 rounded-lg text-sm font-semibold transition-colors"
                :class="mode === 'login' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-700'">
                Login
            </button>
            <button type="button" role="tab" aria-controls="register-panel"
                :aria-selected="(mode === 'register').toString()"
                @click="mode = 'register'"
                class="min-h-11 rounded-lg text-sm font-semibold transition-colors"
                :class="mode === 'register' ? 'bg-white text-zinc-900 shadow-sm' : 'text-zinc-500 hover:text-zinc-700'">
                Register
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-panel" role="tabpanel" x-show="mode === 'login'" hx-post="/auth/login"
            hx-target="#main-content" class="space-y-4">
            <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

            <div id="auth-error" role="alert" aria-live="assertive" tabindex="-1"
                class="empty:hidden rounded-xl bg-red-50 border border-red-200 px-3.5 py-3 text-sm font-medium text-red-700">
            </div>

            <div>
                <label for="login-email" class="label">Email</label>
                <input id="login-email" class="input" placeholder="collector@example.com" type="email"
                    inputmode="email" autocomplete="email" name="email" required />
            </div>

            <div>
                <label for="login-password" class="label">Password</label>
                <input id="login-password" class="input" placeholder="••••••••" type="password"
                    autocomplete="current-password" enterkeyhint="send" name="password" required />
            </div>

            <button type="submit" class="btn-primary w-full min-h-12 text-base">Sign in</button>

            <div class="flex flex-wrap items-center justify-between gap-x-4 pt-1">
                <label class="flex items-center gap-2.5 min-h-11 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-5 h-5 accent-violet-600">
                    <span class="text-sm text-zinc-600">Remember me</span>
                </label>

                <button type="button"
                    @click="$dispatch('notify', { msg: 'Mobile Biometrics Active: Use your device manager to autofill.', type: 'info' })"
                    class="btn-ghost -mr-2 text-sm">
                    <span class="material-symbols-outlined text-[20px]">fingerprint</span>
                    Biometric unlock
                </button>
            </div>
        </form>

        <!-- Register Form -->
        <form id="register-panel" role="tabpanel" x-show="mode === 'register'" x-cloak
            hx-post="/auth/register" hx-target="#main-content" class="space-y-4">
            <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">

            <div id="auth-register-error" role="alert" aria-live="assertive" tabindex="-1"
                class="empty:hidden rounded-xl bg-red-50 border border-red-200 px-3.5 py-3 text-sm font-medium text-red-700">
            </div>

            <div>
                <label for="register-email" class="label">Email</label>
                <input id="register-email" class="input" placeholder="collector@example.com" type="email"
                    inputmode="email" autocomplete="email" name="email" required />
            </div>

            <div>
                <label for="register-password" class="label">Password</label>
                <input id="register-password" class="input" placeholder="••••••••" type="password"
                    autocomplete="new-password" enterkeyhint="next" name="password" required />
            </div>

            <div>
                <label for="register-confirm-password" class="label">Confirm password</label>
                <input id="register-confirm-password" class="input" placeholder="••••••••" type="password"
                    autocomplete="new-password" enterkeyhint="send" name="confirm_password" required />
            </div>

            <button type="submit" @click="signupAttempted = true"
                class="btn-primary w-full min-h-12 text-base">Create account</button>
        </form>

        <!-- Resend verification -->
        <div x-show="signupAttempted && mode === 'register'" x-cloak class="mt-4 text-center">
            <p class="text-sm text-zinc-500 mb-1">Didn't receive the email?</p>
            <button @click="
                if (!resendDisabled) {
                    resendDisabled = true;
                    countdown = 300;
                    let timer = setInterval(() => {
                        countdown--;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            resendDisabled = false;
                        }
                    }, 1000);

                    const emailInput = document.getElementById('register-email');
                    const csrfToken = document.getElementsByName('gorilla.csrf.Token')[0]?.value;
                    const formData = new FormData();
                    formData.append('email', emailInput ? emailInput.value : '');
                    if (csrfToken) formData.append('gorilla.csrf.Token', csrfToken);
                    fetch('/auth/resend', { method: 'POST', body: formData }).then(res => {
                        if (res.ok) {
                            $dispatch('notify', { msg: 'Verification email re-sent', type: 'success' });
                        } else {
                            $dispatch('notify', { msg: 'Rate limit reached, try later', type: 'error' });
                        }
                    });
                }"
                :disabled="resendDisabled"
                class="btn-ghost text-violet-700">
                <span
                    x-text="resendDisabled ? 'Retry in ' + Math.floor(countdown/60) + ':' + (countdown%60).toString().padStart(2, '0') : 'Resend email'"></span>
            </button>
        </div>
    </div>

    <p class="text-center text-xs text-zinc-400 mt-6">© 2026 Pokget</p>
</div>

{{define "auth_success"}}
<div class="w-full max-w-md mx-auto">
    <div class="card p-6 sm:p-8 text-center">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-outlined text-emerald-600 text-3xl">check_circle</span>
        </div>
        <h2 class="text-2xl font-bold mb-2">{{.Message}}</h2>
        <p class="text-sm text-zinc-500 mb-6">You can now sign in to your account.</p>
        <a href="/auth" class="btn-primary w-full min-h-12">Back to login</a>
    </div>
</div>
{{end}}
