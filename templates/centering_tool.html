{{define "centering_tool.html"}}
<div class="card-tools" x-data="{ toolMode: 'scan' }">
    <nav data-i18n-attrs="aria-label" class="card-tools-modes" :class="{ 'card-tools-modes-static': toolMode === 'measure' }" aria-label="Card tools">
        <button data-i18n type="button" @click="toolMode = 'scan'" :aria-pressed="toolMode === 'scan'" data-testid="scanner-mode-scan">Scan</button>
        <button data-i18n type="button" @click="toolMode = 'measure'" :aria-pressed="toolMode === 'measure'" data-testid="open-measure">Measure</button>
    </nav>
    <div x-show="toolMode === 'measure'" x-cloak>{{template "card_measure.html" .}}</div>
    <template x-if="toolMode === 'scan'">
<div x-data="cardScanner({ csrfToken: '{{ .CSRFToken }}' })"
    @pointermove="handleMove($event)" @pointerup="finishGuideDrag()" @pointercancel="finishGuideDrag()"
    @keydown.escape.window="scanning ? cancelScan() : (showGamePopover = false, showLangPopover = false)"
    @visibilitychange.document="document.hidden && pauseDeviceOCR()"
    :data-game="game"
    class="scanner-shell" :class="{ 'scanner-has-error': scanError }">

    <!-- Fullscreen Progress Overlay - Matrix HUD -->
    <div x-show="scanning" x-cloak class="scan-progress-overlay"
        x-effect="scanning && $nextTick(() => $refs.progressCancel?.focus({ preventScroll: true }))"
        role="dialog" aria-modal="true" aria-labelledby="scan-progress-title"
        aria-describedby="scan-progress-detail scan-progress-elapsed" data-testid="scan-progress-overlay">
        <div class="scan-progress-glow" aria-hidden="true"></div>
        <section class="scan-progress-card">
            <div class="scan-progress-mark" aria-hidden="true">
                <span class="scan-progress-orbit"></span>
                <img x-show="scanPreviewURL" :src="scanPreviewURL || undefined" alt="" class="scan-progress-preview" data-testid="scan-progress-preview">
                <svg x-show="!scanPreviewURL" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="8" y="5" width="16" height="22" rx="3" stroke="currentColor" stroke-width="2" />
                    <path d="M12 11h8M12 16h8M12 21h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M4 10V6a2 2 0 0 1 2-2h4M22 4h4a2 2 0 0 1 2 2v4M28 22v4a2 2 0 0 1-2 2h-4M10 28H6a2 2 0 0 1-2-2v-4"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </div>

            <p data-i18n class="scan-progress-kicker" x-text="`Stage ${scanStep || 1} of 5`"></p>
            <h2 data-i18n id="scan-progress-title" class="scan-progress-title">Scanning your card</h2>
            <p data-i18n class="scan-progress-status" x-text="scanStatus" aria-hidden="true"></p>
            <p data-i18n class="sr-only" role="status" aria-live="polite" aria-atomic="true" x-text="scanStatus"></p>

            <div data-i18n-attrs="aria-label" class="scan-progress-track" role="progressbar" aria-label="Card scan progress"
                aria-valuemin="0" aria-valuemax="100" :aria-valuenow="scanProgressPercent"
                :aria-valuetext="scanStatus">
                <div class="scan-progress-fill" :style="`width: ${scanProgressPercent}%`"></div>
            </div>

            <div class="scan-progress-meta">
                <span data-i18n>Working</span>
                <span data-i18n id="scan-progress-elapsed" data-testid="scan-progress-elapsed"
                    x-text="scanElapsedLabel + ' elapsed'"></span>
            </div>
            <p data-i18n id="scan-progress-detail" class="scan-progress-detail" x-text="scanProgressDetail"></p>

            <button data-i18n x-ref="progressCancel" type="button" @click="cancelScan()"
                class="scan-progress-cancel" data-testid="scan-progress-cancel">
                Cancel scan
            </button>
            <p data-i18n class="scan-progress-note">Your prepared image stays available if you cancel.</p>
        </section>
    </div>

    <!-- Viewfinder Camera Frame HUD -->
    <div x-ref="container" :inert="scanning" data-testid="scanner-frame"
        class="scanner-frame" :class="{ 'scanner-frame-empty': !activeStream && !previewURL }">
        <button data-i18n-attrs="aria-label" type="button" x-show="torchAvailable && !previewURL" @click="toggleTorch()"
            :disabled="scanning" :aria-pressed="torchOn.toString()" :aria-label="torchOn ? 'Turn flashlight off' : 'Turn flashlight on'"
            data-testid="scanner-torch"
            class="scanner-float-btn absolute top-3 left-3 z-30">
            <span class="material-symbols-outlined" x-text="torchOn ? 'flashlight_off' : 'flashlight_on'"></span>
        </button>
        <video data-i18n-attrs="aria-label" x-ref="video" x-show="!previewURL" autoplay playsinline muted
            class="absolute inset-0 w-full h-full object-cover md:object-contain"
            aria-label="Live camera preview"></video>

        <img data-i18n-attrs="alt" x-show="previewURL" :src="previewURL" alt="Selected card photo preview"
            class="absolute inset-0 w-full h-full object-contain">

        <div x-show="cameras.length > 1 && !previewURL"
            class="absolute top-3 right-3 z-[60] bg-black/75 backdrop-blur-md rounded-lg border border-white/15 pointer-events-auto">
            <label data-i18n for="scanner-camera" class="sr-only">Camera source</label>
            <select id="scanner-camera" x-model="currentCamera" @change="switchCamera()"
                :disabled="scanning"
                class="bg-transparent text-white/90 text-xs font-semibold px-3 min-h-11 outline-none appearance-none">
                <template x-for="(camera, index) in cameras" :key="camera.deviceId">
                    <option :data-i18n="camera.label ? null : ''" :value="camera.deviceId" x-text="camera.label || 'Camera ' + (index + 1)"></option>
                </template>
            </select>
        </div>

        <div x-show="previewURL" class="scanner-preview-actions">
            <button data-i18n type="button" @click="rotatePreview()" :disabled="scanning"
                class="min-h-11 bg-black/75 border border-white/15 backdrop-blur-md rounded-lg px-3 text-xs font-mono font-semibold text-white disabled:opacity-40">
                ROTATE 90°
            </button>
            <button data-i18n type="button" @click="clearPreview()" :disabled="scanning"
                class="min-h-11 bg-black/75 border border-white/15 backdrop-blur-md rounded-lg px-3 text-xs font-mono font-semibold text-white disabled:opacity-40">
                USE CAMERA
            </button>
        </div>

        <div x-show="!activeStream && !previewURL" class="scanner-empty absolute inset-0 flex flex-col items-center justify-center gap-2 px-6 text-center overflow-y-auto">
            <span class="material-symbols-outlined !text-4xl scanner-accent-solid" aria-hidden="true">photo_camera</span>
            <p data-i18n class="text-base font-semibold text-zinc-100">Add a photo to begin</p>
            <p data-i18n class="max-w-xs text-sm leading-6 text-zinc-400">Use the photo button below, or allow camera access to capture your card.</p>
        </div>

        <!-- Target Reticle & Guides -->
        <div data-i18n-attrs="aria-label" x-show="activeStream || previewURL" class="absolute inset-0 pointer-events-none" aria-label="Card crop guides">
            <!-- Surrounding Masks -->
            <div class="absolute inset-x-0 top-0 bg-black/55 backdrop-blur-[1px]" :style="`height: ${lines.top}%`"></div>
            <div class="absolute inset-x-0 bottom-0 bg-black/55 backdrop-blur-[1px]" :style="`height: ${100 - lines.bottom}%`"></div>
            <div class="absolute left-0 bg-black/55 backdrop-blur-[1px]" :style="`top: ${lines.top}%; bottom: ${100 - lines.bottom}%; width: ${lines.left}%`"></div>
            <div class="absolute right-0 bg-black/55 backdrop-blur-[1px]" :style="`top: ${lines.top}%; bottom: ${100 - lines.bottom}%; width: ${100 - lines.right}%`"></div>

            <!-- Active Card Window with HUD Brackets & Laser -->
            <div class="absolute pointer-events-none" :style="`top: ${lines.top}%; left: ${lines.left}%; width: ${lines.right - lines.left}%; height: ${lines.bottom - lines.top}%;`">
                <!-- Tactical Corner Reticles -->
                <div class="scanner-reticle-corner scanner-reticle-tl"></div>
                <div class="scanner-reticle-corner scanner-reticle-tr"></div>
                <div class="scanner-reticle-corner scanner-reticle-bl"></div>
                <div class="scanner-reticle-corner scanner-reticle-br"></div>
                <!-- Subtle Center Crosshair -->
                <div class="scanner-crosshair"></div>
                <!-- Animated Laser Sweep Line -->
                <div class="scanner-laser"></div>
            </div>

            <!-- Draggable Handles -->
            <button data-i18n-attrs="aria-label" type="button"
                class="absolute top-0 h-full min-h-11 w-[44px] pointer-events-auto cursor-ew-resize touch-none"
                :style="`left: calc(${lines.left}% - 22px)`" role="slider" aria-orientation="horizontal" aria-label="Left crop guide"
                :aria-valuenow="Math.round(lines.left)" aria-valuemin="0" :aria-valuemax="Math.round(lines.right - 5)"
                @pointerdown.prevent="startGuideDrag('left', $event)"
                @keydown.left.prevent="nudgeGuide('left', -1)" @keydown.right.prevent="nudgeGuide('left', 1)">
                <span class="absolute left-1/2 top-0 w-0.5 h-full scanner-accent-line opacity-70 scanner-guide-glow"></span>
            </button>
            <button data-i18n-attrs="aria-label" type="button"
                class="absolute top-0 h-full min-h-11 w-[44px] pointer-events-auto cursor-ew-resize touch-none"
                :style="`left: calc(${lines.right}% - 22px)`" role="slider" aria-orientation="horizontal" aria-label="Right crop guide"
                :aria-valuenow="Math.round(lines.right)" :aria-valuemin="Math.round(lines.left + 5)" aria-valuemax="100"
                @pointerdown.prevent="startGuideDrag('right', $event)"
                @keydown.left.prevent="nudgeGuide('right', -1)" @keydown.right.prevent="nudgeGuide('right', 1)">
                <span class="absolute left-1/2 top-0 w-0.5 h-full scanner-accent-line opacity-70 scanner-guide-glow"></span>
            </button>
            <button data-i18n-attrs="aria-label" type="button"
                class="absolute left-0 w-full h-[44px] pointer-events-auto cursor-ns-resize touch-none"
                :style="`top: calc(${lines.top}% - 22px)`" role="slider" aria-orientation="vertical" aria-label="Top crop guide"
                :aria-valuenow="Math.round(lines.top)" aria-valuemin="0" :aria-valuemax="Math.round(lines.bottom - 5)"
                @pointerdown.prevent="startGuideDrag('top', $event)"
                @keydown.up.prevent="nudgeGuide('top', -1)" @keydown.down.prevent="nudgeGuide('top', 1)">
                <span class="absolute left-0 top-1/2 h-0.5 w-full scanner-accent-line opacity-70 scanner-guide-glow"></span>
            </button>
            <button data-i18n-attrs="aria-label" type="button"
                class="absolute left-0 w-full h-[44px] pointer-events-auto cursor-ns-resize touch-none"
                :style="`top: calc(${lines.bottom}% - 22px)`" role="slider" aria-orientation="vertical" aria-label="Bottom crop guide"
                :aria-valuenow="Math.round(lines.bottom)" :aria-valuemin="Math.round(lines.top + 5)" aria-valuemax="100"
                @pointerdown.prevent="startGuideDrag('bottom', $event)"
                @keydown.up.prevent="nudgeGuide('bottom', -1)" @keydown.down.prevent="nudgeGuide('bottom', 1)">
                <span class="absolute left-0 top-1/2 h-0.5 w-full scanner-accent-line opacity-70 scanner-guide-glow"></span>
            </button>

            <!-- Centering Metric Telemetry Pills -->
            <div class="scanner-metric-overlay absolute rounded border scanner-accent-border bg-black/85 px-2 py-0.5 text-xs font-mono font-bold scanner-accent-text backdrop-blur-md shadow-md"
                :style="`left: 3%; top: ${(lines.top + lines.bottom) / 2}%`"><span data-i18n>L/R </span><span x-text="metrics.lr"></span></div>
            <div class="scanner-metric-overlay absolute rounded border scanner-accent-border bg-black/85 px-2 py-0.5 text-xs font-mono font-bold scanner-accent-text backdrop-blur-md shadow-md"
                :style="`left: ${(lines.left + lines.right) / 2}%; top: 3%`"><span data-i18n>T/B </span><span x-text="metrics.tb"></span></div>
        </div>
    </div>

    <!-- Scanner Bottom Controls (Thumb-Zone Ergonomics) -->
    <div :inert="scanning" data-testid="scanner-controls"
        class="scanner-controls">
        <p data-i18n class="sr-only">Only the area inside the guides is uploaded.</p>
        <div data-testid="scanner-privacy-note" class="scanner-privacy-note">
            <span class="material-symbols-outlined align-middle text-sm scanner-accent-solid" aria-hidden="true">shield_lock</span>
            <span data-i18n>Only the framed area is uploaded</span>
        </div>

        <!-- Compact Glass Quick Controls: TCG & Language Flag Popover (Concept B) -->
        <div class="scanner-quick-bar relative flex items-center justify-between gap-2 z-30">
            <!-- TCG Selector Pill -->
            <div class="relative flex-1 min-w-0" @click.away="showGamePopover = false">
                <button data-i18n-attrs="aria-label" type="button" @click="showGamePopover = !showGamePopover" :disabled="scanning"
                    class="w-full flex items-center justify-between min-h-11 px-3 rounded-xl bg-black/60 hover:bg-black/80 border border-white/15 text-xs font-mono text-white transition-all shadow-md backdrop-blur-md"
                    :class="showGamePopover ? 'scanner-accent-border-strong scanner-accent-fill scanner-accent-ring' : ''"
                    aria-label="Select Trading Card Game" :aria-expanded="showGamePopover.toString()">
                    <span class="truncate font-semibold text-white" x-text="gameDisplayName(game)"></span>
                    <span class="material-symbols-outlined text-sm scanner-accent-solid ml-1 shrink-0" :class="showGamePopover ? 'rotate-180 transition-transform' : 'transition-transform'">expand_more</span>
                </button>

                <!-- TCG Dropdown Sheet (fixed: escapes the scrolling control pane) -->
                <div x-show="showGamePopover" x-cloak role="dialog" aria-modal="false" data-testid="scanner-game-menu"
                    class="scanner-menu">
                    <div class="text-[10px] font-mono uppercase tracking-wider text-zinc-400 px-2 py-1 border-b border-white/10" data-i18n>Select TCG</div>
                    <template x-for="g in [
                        { id: 'pokemon', label: 'Pokémon' },
                        { id: 'magic', label: 'Magic: The Gathering' },
                        { id: 'one_piece', label: 'One Piece' },
                        { id: 'lorcana', label: 'Disney Lorcana' },
                        { id: 'weiss_schwarz', label: 'Weiss Schwarz' },
                        { id: 'yugioh', label: 'Yu-Gi-Oh!' },
                        { id: 'star_wars_unlimited', label: 'Star Wars: Unlimited' },
                        { id: 'flesh_and_blood', label: 'Flesh and Blood' },
                        { id: 'digimon', label: 'Digimon Card Game' },
                        { id: 'grand_archive', label: 'Grand Archive TCG' },
                        { id: 'altered', label: 'Altered' },
                        { id: 'sorcery', label: 'Sorcery: Contested Realm' },
                        { id: 'dragon_ball_super', label: 'Dragon Ball Super' },
                        { id: 'dbs_fusion_world', label: 'DBS Fusion World' },
                        { id: 'union_arena', label: 'Union Arena' },
                        { id: 'gundam', label: 'Gundam Card Game' },
                        { id: 'battlespirits_saga', label: 'Battle Spirits Saga' },
                        { id: 'world_of_warcraft', label: 'World of Warcraft TCG' },
                        { id: 'fftcg', label: 'Final Fantasy TCG' },
                        { id: 'godzilla', label: 'Godzilla Card Game' },
                        { id: 'shadowverse_evolve', label: 'Shadowverse: Evolve' },
                        { id: 'universus', label: 'UniVersus' },
                        { id: 'vanguard', label: 'Cardfight!! Vanguard' },
                        { id: 'hololive', label: 'hololive OCG' },
                        { id: 'duel_masters', label: 'Duel Masters' },
                        { id: 'cookie_run', label: 'CookieRun: Braverse' },
                        { id: 'force_of_will', label: 'Force of Will' },
                        { id: 'wixoss', label: 'WIXOSS' },
                        { id: 'alpha_clash', label: 'Alpha Clash' },
                        { id: 'riftbound', label: 'Riftbound TCG' }
                    ]" :key="g.id">
                        <button type="button" @click="setGame(g.id)"
                            class="w-full min-h-11 flex items-center justify-between px-2.5 py-2 rounded-lg text-xs font-mono transition-colors text-left"
                            :class="game === g.id ? 'scanner-accent-cta text-white font-bold' : 'text-zinc-300 hover:bg-white/10 hover:text-white'">
                            <span x-text="g.label"></span>
                            <span class="material-symbols-outlined text-sm text-white" x-show="game === g.id" aria-hidden="true">check</span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Hidden accessible selects for backwards compatibility & tests -->
            <select id="scanner-game" x-model="game" class="sr-only" tabindex="-1" aria-hidden="true">
                <option data-i18n value="pokemon">Pokémon</option>
                <option data-i18n value="magic">Magic: The Gathering</option>
                <option data-i18n value="one_piece">One Piece</option>
                <option data-i18n value="lorcana">Disney Lorcana</option>
                <option data-i18n value="weiss_schwarz">Weiss Schwarz</option>
                <option data-i18n value="yugioh">Yu-Gi-Oh!</option>
                <option data-i18n value="star_wars_unlimited">Star Wars: Unlimited</option>
                <option data-i18n value="flesh_and_blood">Flesh and Blood</option>
                <option data-i18n value="digimon">Digimon Card Game</option>
                <option data-i18n value="grand_archive">Grand Archive TCG</option>
                <option data-i18n value="altered">Altered</option>
                <option data-i18n value="sorcery">Sorcery: Contested Realm</option>
                <option data-i18n value="dragon_ball_super">Dragon Ball Super</option>
                <option data-i18n value="dbs_fusion_world">DBS Fusion World</option>
                <option data-i18n value="union_arena">Union Arena</option>
                <option data-i18n value="gundam">Gundam Card Game</option>
                <option data-i18n value="battlespirits_saga">Battle Spirits Saga</option>
                <option data-i18n value="world_of_warcraft">World of Warcraft TCG</option>
                <option data-i18n value="fftcg">Final Fantasy TCG</option>
                <option data-i18n value="godzilla">Godzilla Card Game</option>
                <option data-i18n value="shadowverse_evolve">Shadowverse: Evolve</option>
                <option data-i18n value="universus">UniVersus</option>
                <option data-i18n value="vanguard">Cardfight!! Vanguard</option>
                <option data-i18n value="hololive">hololive OCG</option>
                <option data-i18n value="duel_masters">Duel Masters</option>
                <option data-i18n value="cookie_run">CookieRun: Braverse</option>
                <option data-i18n value="force_of_will">Force of Will</option>
                <option data-i18n value="wixoss">WIXOSS</option>
                <option data-i18n value="alpha_clash">Alpha Clash</option>
                <option data-i18n value="riftbound">Riftbound TCG</option>
            </select>
            <select id="scanner-language" x-model="lang" class="sr-only" tabindex="-1" aria-hidden="true">
                <template x-for="language in availableLanguages" :key="language.value">
                    <option data-i18n :value="language.value" x-text="language.label"></option>
                </template>
            </select>

            <!-- Language Flag Pill Popover (Concept B) -->
            <div class="relative shrink-0" x-show="availableLanguages.length > 1" @click.away="showLangPopover = false">
                <button data-i18n-attrs="aria-label" type="button" @click="showLangPopover = !showLangPopover" :disabled="scanning"
                    class="flex items-center gap-1.5 min-h-11 px-3 rounded-xl bg-black/60 hover:bg-black/80 border border-white/15 text-xs font-mono text-white transition-all shadow-md backdrop-blur-md"
                    :class="showLangPopover ? 'scanner-accent-border-strong scanner-accent-fill scanner-accent-ring' : ''"
                    aria-label="Select card language" :aria-expanded="showLangPopover.toString()">
                    <span class="text-base leading-none" x-text="currentLangFlag(lang)"></span>
                    <span class="font-bold scanner-accent-text uppercase" x-text="currentLangCode(lang)"></span>
                    <span class="material-symbols-outlined text-sm scanner-accent-solid shrink-0" :class="showLangPopover ? 'rotate-180 transition-transform' : 'transition-transform'">expand_more</span>
                </button>

                <!-- Language Flag Sheet (fixed: escapes the scrolling control pane) -->
                <div x-show="showLangPopover" x-cloak role="dialog" aria-modal="false" data-testid="scanner-language-menu"
                    class="scanner-menu">
                    <div class="text-[10px] font-mono uppercase tracking-wider text-zinc-400 px-1.5 pb-1.5 mb-1.5 border-b border-white/10" data-i18n>Card language</div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <template x-for="l in availableLanguages" :key="l.value">
                            <button type="button" @click="setLanguage(l.value)"
                                class="min-h-11 flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs font-mono transition-colors text-left"
                                :class="lang === l.value ? 'scanner-accent-cta text-white font-bold shadow-md scanner-accent-glow' : 'bg-white/5 text-zinc-300 hover:bg-white/10 hover:text-white border border-white/5'">
                                <span class="text-base leading-none" x-text="l.flag || currentLangFlag(l.value)"></span>
                                <span class="truncate" x-text="l.code || currentLangCode(l.value)"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Feedback -->
        <p data-i18n x-show="cameraError" x-text="cameraError" role="status" aria-live="polite"
            class="rounded-xl border border-amber-500/30 bg-amber-500/10 px-3.5 py-3 text-sm text-amber-200"></p>
        <p data-i18n x-show="scanError" x-text="scanError" x-ref="scanError" tabindex="-1" role="alert" aria-live="assertive"
            class="rounded-xl border scanner-accent-border scanner-accent-fill px-3.5 py-3 text-sm scanner-accent-text"></p>

        <!-- Primary Shutter Button Deck (Ergonomic Thumb-Zone) -->
        <div class="scanner-shutter-wrap">
            <!-- Choose Photo (Gallery) - icon only -->
            <label for="scanner-file" data-i18n-attrs="aria-label" aria-label="Choose photo" data-testid="scanner-choose-photo"
                class="scanner-icon-btn shrink-0">
                <span class="material-symbols-outlined text-xl" aria-hidden="true">photo_library</span>
                <input id="scanner-file" type="file" accept="image/jpeg,image/png,image/webp" class="sr-only"
                    :disabled="scanning" @change="handleFileUpload($event)">
            </label>

            <!-- Tactile Shutter Button -->
            <button data-i18n-attrs="aria-label" type="button" x-show="!previewURL" @click="capture()"
                :disabled="scanning || !activeStream" :aria-busy="scanning.toString()"
                class="min-h-[72px] scanner-shutter-btn group"
                aria-label="Capture framed card">
                <span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform" aria-hidden="true">photo_camera</span>
            </button>

            <!-- Scan Selected Crop Button (When preview is ready) -->
            <button data-i18n data-i18n-attrs="aria-label" type="button" x-show="previewURL" @click="scanUpload()" :disabled="scanning"
                data-testid="scan-selected-crop"
                class="min-h-[72px] scanner-shutter-btn"
                aria-label="Scan selected crop">
                <span class="material-symbols-outlined text-2xl" aria-hidden="true">search</span>
            </button>
        </div>

        <!-- Full-width fallback button for direct image upload -->
        <button data-i18n type="button" x-show="lastScanBlob && (needsReview || scanError)" :disabled="scanning"
            @click="submitPreparedBlob(lastScanBlob, lastScanName || 'retry.jpg', false, true)"
            data-testid="scanner-server-scan"
            class="scanner-accent-fill w-full min-h-11 rounded-xl border scanner-accent-border px-3 text-xs font-mono scanner-accent-text transition-colors">Use server image scan</button>

        <!-- Identified Card Sheet -->
        <section x-show="detectedCard" x-cloak x-ref="scanResult" tabindex="-1" class="scan-result" aria-labelledby="scan-result-title">
            <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/10">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="size-2 rounded-full shrink-0" :class="needsReview && !matchConfirmed ? 'bg-amber-400' : 'bg-emerald-400'"></span>
                    <h3 data-i18n id="scan-result-title" class="text-sm font-semibold font-mono truncate" x-text="needsReview && !matchConfirmed ? 'Check this printing' : (added ? 'Saved to your collection' : 'Card identified')"></h3>
                </div>
                <button data-i18n-attrs="aria-label" type="button" @click="resetResult()"
                    class="min-h-11 min-w-11 flex shrink-0 items-center justify-center rounded-lg text-zinc-400 hover:text-white hover:bg-white/10 transition-colors"
                    aria-label="Dismiss">
                    <span class="material-symbols-outlined text-lg" aria-hidden="true">close</span>
                </button>
            </div>
            <p data-i18n class="mt-1.5 text-xs text-zinc-300" x-show="needsReview && !matchConfirmed">Similar cards can share a name or artwork. Compare your physical card before saving.</p>

            <div class="mt-3.5 flex gap-4">
                <img x-show="detectedImage" :src="detectedImage" :alt="detectedCard" class="scan-result-image" referrerpolicy="no-referrer">
                <div class="min-w-0 flex-1">
                    <p class="text-base font-bold leading-6 break-words font-mono text-white" data-testid="detected-card-id" :data-card-id="detectedID" x-text="detectedCard"></p>
                    <p class="mt-1 text-xs text-zinc-300 font-mono" x-text="detectedSet"></p>
                    <p class="mt-1 text-xs text-zinc-400 font-mono" x-text="[detectedNumber ? '#' + detectedNumber : '', detectedLanguage.toUpperCase()].filter(Boolean).join(' · ')"></p>
                    <div class="mt-2.5 inline-block rounded scanner-accent-fill border scanner-accent-border px-2 py-1 text-xs font-mono font-bold scanner-accent-text">
                        <span data-i18n x-text="priceLoading ? 'Fetching price…' : (parseFloat(detectedPrice) > 0 ? '{{ .CurrencySymbol }}' + parseFloat(detectedPrice).toFixed(2) : 'Price unavailable')"></span>
                    </div>
                </div>
            </div>

            <!-- Alternative Printings Comparison -->
            <fieldset x-show="needsReview && !matchConfirmed && topMatches.length" class="mt-4">
                <legend data-i18n class="mb-2 text-xs font-mono font-semibold uppercase text-zinc-300">Compare possible printings</legend>
                <div class="scan-candidates">
                    <template x-for="match in topMatches" :key="match.id">
                        <button type="button" @click="selectMatch(match)" class="scan-candidate min-h-11" :data-card-id="match.id" :aria-pressed="(detectedID === match.id).toString()">
                            <img x-show="match.image_url" :src="match.image_url" alt="" loading="lazy" referrerpolicy="no-referrer">
                            <span class="min-w-0 flex-1 font-mono">
                                <span class="block font-bold text-white text-xs" x-text="match.name"></span>
                                <span class="block mt-0.5 text-[11px] text-zinc-400" x-text="[match.set, match.collector_number ? '#' + match.collector_number : '', match.language.toUpperCase()].filter(Boolean).join(' · ')"></span>
                            </span>
                            <span class="material-symbols-outlined ml-auto scanner-accent-solid text-lg" x-show="detectedID === match.id" aria-hidden="true">check_circle</span>
                        </button>
                    </template>
                </div>
            </fieldset>

            <button data-i18n type="button" x-show="needsReview && !matchConfirmed" @click="confirmMatch()" data-testid="confirm-printing"
                class="mt-3.5 w-full min-h-12 rounded-xl border scanner-accent-border scanner-accent-fill hover:bg-white/10 scanner-accent-text font-mono font-semibold text-xs transition-colors">This is my printing</button>
            <button type="button" @click="addToCollection()" x-show="(detectedID || detectedCard) && (!needsReview || matchConfirmed)" :disabled="adding || added"
                class="mt-3.5 w-full min-h-12 rounded-xl scanner-accent-cta hover:brightness-110 text-white font-mono font-semibold text-sm shadow-lg scanner-accent-glow disabled:opacity-50 transition-all">
                <span data-i18n x-text="adding ? 'Saving…' : (added ? 'Added to collection' : 'Add to collection')"></span>
            </button>
            <button data-i18n type="button" x-show="!added && (!needsReview || matchConfirmed)" @click="reviewMatches()"
                class="mt-2 min-h-11 w-full text-xs font-mono text-zinc-400 hover:text-white underline underline-offset-4">Review printing</button>
            <p data-i18n x-show="needsReview && !matchConfirmed" class="mt-2 text-[11px] leading-5 text-zinc-400">None of these match? Adjust the crop and retry.</p>
        </section>

    </div>

    <input type="hidden" name="gorilla.csrf.Token" :value="csrfToken">
</div>
    </template>
</div>
{{end}}
