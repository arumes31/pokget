<div class="fixed inset-0 z-[100] flex flex-col justify-end" x-show="showAddModal"
    x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-full"
    x-transition:enter-end="translate-y-0" x-transition:leave="transition ease-in duration-300"
    x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full"
    @keydown.escape.window="showAddModal = false" role="dialog" aria-modal="true" aria-labelledby="add-card-title">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-zinc-900/50 backdrop-blur-sm" @click="showAddModal = false" aria-hidden="true"></div>

    <!-- Modal Content -->
    <div class="relative card w-full max-w-md mx-auto rounded-t-3xl rounded-b-none border-b-0 border-x-0 p-5 sm:p-8 z-10 max-h-[90vh] overflow-y-auto no-scrollbar"
        style="padding-bottom: max(2rem, env(safe-area-inset-bottom))"
        x-data="{ 
            loading: false,
            async submit() {
                this.loading = true;
                await new Promise(r => setTimeout(r, 800));
                this.loading = false;
                showAddModal = false;
                $dispatch('notify', { msg: 'Card added to collection!', type: 'success' });
            }
         }">
        <div class="w-12 h-1.5 bg-zinc-300 dark:bg-stone-300 rounded-full mx-auto mb-6"></div>

        <h3 data-i18n id="add-card-title" class="text-xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">Add to Portfolio</h3>

        <form @submit.prevent="submit" class="space-y-5">
            <!-- Card Details Preview -->
            <div class="flex gap-4 p-4 bg-zinc-50 dark:bg-stone-50 rounded-2xl border border-zinc-200 dark:border-stone-200">
                <img data-i18n-attrs="alt" src="https://images.pokemontcg.io/swsh45/19_hires.png" alt="Charizard VMAX"
                    class="w-16 h-20 object-contain">
                <div class="min-w-0">
                    <p data-i18n class="font-bold text-zinc-900 dark:text-zinc-100">Charizard VMAX</p>
                    <p data-i18n class="text-xs text-zinc-500 dark:text-zinc-400">Shining Fates • SV107/SV122</p>
                    <p class="text-sm font-bold text-violet-700 dark:text-violet-300 mt-2">{{ .CurrencySymbol }}120.50 (<span>TCGPlayer</span>)</p>
                </div>
            </div>

            <!-- Inputs -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label data-i18n for="condition" class="label">Condition</label>
                    <select id="condition" class="input appearance-none">
                        <option data-i18n value="NM">Near Mint</option>
                        <option data-i18n value="LP">Lightly Played</option>
                        <option data-i18n value="MP">Moderately Played</option>
                    </select>
                </div>
                <div>
                    <label data-i18n for="format" class="label">Format</label>
                    <select id="format" class="input appearance-none">
                        <option data-i18n value="Raw">Raw</option>
                        <option data-i18n value="Graded">Graded</option>
                        <option data-i18n value="Sealed">Sealed</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label data-i18n for="language" class="label">Language</label>
                    <select id="language" name="language" class="input appearance-none">
                        <option data-i18n value="en">English</option>
                        <option data-i18n value="jp">Japanese</option>
                        <option data-i18n value="fr">French</option>
                        <option data-i18n value="de">German</option>
                    </select>
                </div>
                <div>
                    <!-- Reserved for future use -->
                </div>
            </div>

            <div>
                <span data-i18n class="label">Grading Company</span>
                <div data-i18n-attrs="aria-label" class="grid grid-cols-3 gap-2" role="group" aria-label="Select grading company">
                    <button data-i18n type="button" class="btn-secondary border-violet-500 text-violet-700 dark:text-violet-300">PSA</button>
                    <button data-i18n type="button" class="btn-secondary">BGS</button>
                    <button data-i18n type="button" class="btn-secondary">CGC</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label data-i18n for="purchase-price" class="label">Purchase Price</label>
                    <input type="number" id="purchase-price" inputmode="decimal" placeholder="100.00" step="0.01"
                        class="input">
                </div>
                <div>
                    <label data-i18n for="currency" class="label">Currency</label>
                    <select id="currency" class="input appearance-none">
                        <option data-i18n value="USD">USD</option>
                        <option data-i18n value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <div>
                <label data-i18n for="binder-location" class="label">Binder
                    Location</label>
                <select id="binder-location" class="input appearance-none">
                    <option data-i18n value="Main Binder">Main Binder</option>
                    <option data-i18n value="Charizard Master Set">Charizard Master Set</option>
                    <option data-i18n value="For Sale / Trade">For Sale / Trade</option>
                </select>
            </div>

            <button type="submit" :disabled="loading"
                class="btn-primary w-full min-h-12 text-base">
                <span data-i18n x-show="!loading">ADD TO COLLECTION</span>
                <span data-i18n x-show="loading" class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    PROCESSING...
                </span>
            </button>
        </form>
    </div>
</div>
