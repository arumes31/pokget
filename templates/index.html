<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <title>Pokget — Your TCG Collection</title>
    <link rel="stylesheet" href="/static/css/tailwind.css?v={{ .BuildVersion }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="/static/js/scanner.js?v={{ .BuildVersion }}" defer></script>
    <script src="/static/js/alpine.min.js?v=3" defer></script>
    <script src="/static/js/htmx.min.js?v=3"></script>
    <script src="/static/js/vault.js?v=4" defer></script>
    <link rel="icon" type="image/png" href="/static/img/logo.png?v=3">
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7c3aed">
    <meta name="csrf-token" content="{{ .CSRFToken }}">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .catch((error) => console.warn('Service worker registration failed', error));
            });
        }
    </script>
</head>

<body class="bg-zinc-100 text-zinc-900 min-h-dvh overflow-x-hidden" x-data="{
          activeTab: '{{ .InitialView }}',
          showEditModal: false,
          editItemId: '',
          editNotes: '',
          editCustomPrice: '',
          editGrade: '',
          editIsPublic: false,
          editBinderId: '',
          editError: '',
          editTrigger: null,
          deferredPrompt: null,
          showPwaPrompt: false,
          isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream,
          isPwaInstalled: window.matchMedia('(display-mode: standalone)').matches
      }" @beforeinstallprompt.window="deferredPrompt = $event; showPwaPrompt = !isPwaInstalled"
    hx-headers='{"X-CSRF-Token": "{{ .CSRFToken }}"}'
    @open-edit-modal.window="showEditModal = true; editItemId = $event.detail.id; editNotes = $event.detail.notes; editCustomPrice = $event.detail.price; editGrade = $event.detail.grade; editIsPublic = $event.detail.isPublic; editBinderId = $event.detail.binderId; editError = ''; editTrigger = $event.detail.trigger; $nextTick(() => $refs.editPrice.focus())"
    @pokget-view-change.window="activeTab = $event.detail.view">

    <!-- Top app bar -->
    <header class="fixed top-0 w-full z-50 bg-white/85 backdrop-blur-xl border-b border-zinc-200"
        style="padding-top: env(safe-area-inset-top)">
        <div class="flex justify-between items-center px-4 h-16 w-full max-w-6xl mx-auto">
            <div class="flex items-center gap-2.5">
                <img src="/static/img/logo.png" alt="" class="w-8 h-8">
                <h1 class="text-lg font-extrabold tracking-tight text-zinc-900">Pokget</h1>
            </div>
            <div class="flex items-center gap-3">
                {{ if .UserRank }}
                <div class="hidden sm:flex flex-col items-end gap-1.5">
                    <span class="text-[10px] font-semibold uppercase tracking-wider text-violet-700">{{ .UserRank }}</span>
                    <div class="w-24 h-1.5 bg-zinc-200 rounded-full overflow-hidden">
                        <div class="h-full bg-violet-600 rounded-full"
                            x-init="$el.style.width = '{{ .UserXPPercent }}%'"></div>
                    </div>
                </div>
                {{ end }}
                <div class="relative" x-data="{ open: false }">
                    <button type="button" @click="open = !open" @keydown.escape="open = false"
                        :aria-expanded="open.toString()" aria-haspopup="menu" aria-label="Open account menu"
                        class="w-11 h-11 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center active:bg-violet-200 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined">account_circle</span>
                    </button>

                    <!-- Dropdown Menu -->
                    <div x-show="open" @click.away="open = false" x-transition:enter="transition ease-out duration-100"
                        role="menu" aria-label="Account actions"
                        x-transition:enter-start="transform opacity-0 scale-95"
                        x-transition:enter-end="transform opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="transform opacity-100 scale-100"
                        x-transition:leave-end="transform opacity-0 scale-95"
                        class="absolute right-0 mt-2 w-52 card shadow-lg z-[60] overflow-hidden"
                        x-cloak>
                        <div class="px-4 py-3 border-b border-zinc-200">
                            <p class="text-[10px] font-semibold text-violet-700 uppercase tracking-wider">{{ .UserRank }}
                            </p>
                            <p class="text-sm font-semibold text-zinc-900 truncate">My account</p>
                        </div>
                        <div class="p-1.5">
                            <a href="/?view=settings" hx-get="/settings" hx-target="#main-content"
                                role="menuitem"
                                hx-push-url="/?view=settings" @click="activeTab = 'settings'; open = false"
                                class="w-full flex items-center gap-2.5 px-3 min-h-11 text-sm font-medium text-zinc-700 hover:bg-zinc-100 rounded-lg transition-colors">
                                <span class="material-symbols-outlined text-[20px]">person</span>
                                <span>Settings</span>
                            </a>
                            <button type="button" role="menuitem" hx-post="/auth/logout"
                                class="w-full flex items-center gap-2.5 px-3 min-h-11 text-sm font-medium text-zinc-700 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors">
                                <span class="material-symbols-outlined text-[20px]">logout</span>
                                <span>Log out</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="pt-20 pb-28 px-4 w-full max-w-6xl mx-auto"
        hx-get="{{ .InitialPath }}" hx-trigger="load" hx-sync="this:replace">
        <!-- Content will be loaded here via HTMX -->
        <!-- Skeleton Content: Shown during initial load -->
        <div class="space-y-6 htmx-indicator" id="dashboard-skeleton">
            <div class="card p-6 h-44 skeleton"></div>
            <div class="flex gap-4 overflow-hidden">
                <div class="card min-w-[160px] h-24 skeleton"></div>
                <div class="card min-w-[200px] h-24 skeleton"></div>
                <div class="card min-w-[160px] h-24 skeleton"></div>
            </div>
            <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">
                <div class="aspect-[3/4] card skeleton"></div>
                <div class="aspect-[3/4] card skeleton"></div>
                <div class="aspect-[3/4] card skeleton"></div>
                <div class="aspect-[3/4] card skeleton"></div>
                <div class="aspect-[3/4] card skeleton"></div>
                <div class="aspect-[3/4] card skeleton"></div>
            </div>
        </div>
    </main>

    <!-- Bottom tab bar -->
    <nav hx-sync="#main-content:replace"
        class="fixed bottom-0 w-full z-50 bg-white/95 backdrop-blur-xl border-t border-zinc-200"
        style="padding-bottom: env(safe-area-inset-bottom)" aria-label="Primary">
        <div class="flex justify-around items-stretch w-full max-w-2xl mx-auto">
            <!-- Home -->
            <button @click="activeTab = 'home'" hx-get="/dashboard" hx-target="#main-content" hx-push-url="/?view=home"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'home' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'home' && 'fill-icon'">home</span>
                <span class="text-[10px] font-semibold">Vault</span>
            </button>
            <!-- Wantlist -->
            <button @click="activeTab = 'wantlist'" hx-get="/wantlist" hx-target="#main-content" hx-push-url="/?view=wantlist"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'wantlist' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'wantlist' && 'fill-icon'">favorite</span>
                <span class="text-[10px] font-semibold">Grails</span>
            </button>
            <!-- Binders -->
            <button @click="activeTab = 'binders'" hx-get="/binders" hx-target="#main-content" hx-push-url="/?view=binders"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'binders' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'binders' && 'fill-icon'">style</span>
                <span class="text-[10px] font-semibold">Binders</span>
            </button>
            <!-- Scan -->
            <button @click="activeTab = 'scan'" hx-get="/centering" hx-target="#main-content" hx-push-url="/?view=scan"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'scan' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'scan' && 'fill-icon'">qr_code_scanner</span>
                <span class="text-[10px] font-semibold">Scan</span>
            </button>
            <!-- Errors -->
            <button @click="activeTab = 'errors'" hx-get="/errors" hx-target="#main-content" hx-push-url="/?view=errors"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'errors' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'errors' && 'fill-icon'">warning</span>
                <span class="text-[10px] font-semibold">Misprints</span>
            </button>
            <!-- Trade -->
            <button @click="activeTab = 'trade'" hx-get="/trade" hx-target="#main-content" hx-push-url="/?view=trade"
                class="flex flex-col items-center justify-center gap-0.5 flex-1 min-w-[44px] min-h-[56px] py-1.5 transition-colors"
                :class="activeTab === 'trade' ? 'text-violet-700' : 'text-zinc-500 hover:text-zinc-700'">
                <span class="material-symbols-outlined" :class="activeTab === 'trade' && 'fill-icon'">swap_horiz</span>
                <span class="text-[10px] font-semibold">Trade</span>
            </button>
        </div>
    </nav>

    <!-- Toast Notification -->
    <div x-data="{ toasts: [] }" x-cloak role="status" aria-live="polite" aria-atomic="true"
        @notify.window="toasts.push({ id: Date.now(), msg: $event.detail.msg, type: $event.detail.type }); setTimeout(() => toasts.shift(), 3000)"
        class="fixed top-4 inset-x-4 z-[100] flex flex-col items-center gap-2 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-transition.duration.300ms class="card px-4 py-3 shadow-lg flex items-center gap-3 border-l-4 w-full max-w-sm"
                :class="toast.type === 'error' ? 'border-red-500' : 'border-violet-600'">
                <span class="material-symbols-outlined text-lg"
                    :class="toast.type === 'error' ? 'text-red-600' : 'text-violet-700'"
                    x-text="toast.type === 'error' ? 'error' : 'check_circle'"></span>
                <p class="text-sm font-semibold" x-text="toast.msg"></p>
            </div>
        </template>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" x-show="showEditModal" x-cloak role="dialog" aria-modal="true"
        aria-labelledby="edit-modal-title" @keydown.escape.window="if (showEditModal) { showEditModal = false; $nextTick(() => editTrigger?.focus()) }"
        class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-4 bg-zinc-900/50"
        @click.self="showEditModal = false; $nextTick(() => editTrigger?.focus())">
        <div class="card w-full sm:max-w-md rounded-b-none sm:rounded-b-2xl p-5 sm:p-6 space-y-4 max-h-[90dvh] overflow-y-auto"
            style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom))">
            <h3 id="edit-modal-title" class="text-xl font-bold text-zinc-900">Edit Card Details</h3>
            <p x-show="editError" x-text="editError" role="alert" aria-live="assertive"
                class="rounded-xl bg-red-50 border border-red-200 px-3.5 py-3 text-sm font-medium text-red-700"></p>
            <form id="edit-form" hx-post="/portfolio/edit" hx-swap="none"
                @htmx:after-request="if ($event.detail.successful) { showEditModal = false; htmx.ajax('GET', '/dashboard', { target: '#main-content', source: document.body }); $nextTick(() => editTrigger?.focus()) } else { editError = $event.detail.xhr.responseText.trim() || 'Unable to save card details' }"
                class="space-y-4">
                <input id="edit-item-id" type="hidden" name="item_id" :value="editItemId">
                <div>
                    <label for="edit-custom-price" class="label">Custom price override ({{
                        .CurrencySymbol }})</label>
                    <input id="edit-custom-price" x-ref="editPrice" type="number" step="0.01" name="custom_price" :value="editCustomPrice"
                        @input="editCustomPrice = $event.target.value"
                        class="input">
                </div>
                <div>
                    <label for="edit-notes" class="label">Private notes (e.g. miscut, error)</label>
                    <textarea id="edit-notes" name="notes" :value="editNotes" @input="editNotes = $event.target.value"
                        class="input min-h-24 py-2.5"></textarea>
                </div>
                <div>
                    <label for="edit-grade" class="label">Grade</label>
                    <input id="edit-grade" type="text" name="grade" x-model="editGrade" placeholder="e.g. 9.5"
                        class="input">
                </div>
                <label class="flex items-center gap-2.5 min-h-11 text-sm text-zinc-700 cursor-pointer">
                    <input type="checkbox" name="is_public" value="true" x-model="editIsPublic"
                        class="w-5 h-5 accent-violet-600">
                    Show this card in my public vault
                </label>
                <div class="flex gap-3">
                    <button type="button" class="btn-secondary flex-1"
                        @click="showEditModal = false; $nextTick(() => editTrigger?.focus())">Cancel</button>
                    <button type="submit" class="btn-primary flex-1">Save changes</button>
                </div>
            </form>
            <form hx-post="/portfolio/binder" hx-swap="none"
                @htmx:after-request="if ($event.detail.successful) { showEditModal = false; htmx.ajax('GET', '/dashboard', { target: '#main-content', source: document.body }); $nextTick(() => editTrigger?.focus()) } else { editError = $event.detail.xhr.responseText.trim() || 'Unable to move card' }"
                class="space-y-3 border-t border-zinc-200 pt-4">
                <input type="hidden" name="item_id" :value="editItemId">
                <label for="edit-binder" class="label">Binder</label>
                <div class="flex gap-3">
                    <select id="edit-binder" name="binder_id" x-model="editBinderId"
                        class="input flex-1">
                        <option value="">Main vault (unfiled)</option>
                        {{ range .Binders }}
                        <option value="{{ .ID }}">{{ .Name }}</option>
                        {{ end }}
                    </select>
                    <button type="submit" class="btn-primary">Move</button>
                </div>
            </form>
            <button type="button" hx-post="/portfolio/delete" hx-include="#edit-item-id" hx-swap="none"
                hx-confirm="Remove this card from your vault?"
                @htmx:after-request="if ($event.detail.successful) { showEditModal = false; htmx.ajax('GET', '/dashboard', { target: '#main-content', source: document.body }); $nextTick(() => editTrigger?.focus()) } else { editError = $event.detail.xhr.responseText.trim() || 'Unable to remove card' }"
                class="btn-danger w-full">
                Remove from vault
            </button>
        </div>
    </div>

    <!-- PWA Install Prompt -->
    <div x-show="showPwaPrompt" x-transition:enter="transition ease-out duration-500"
        x-transition:enter-start="translate-y-full opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
        class="fixed bottom-24 inset-x-4 z-[110] sm:max-w-md sm:left-auto sm:right-4" x-cloak>
        <div class="card p-5 shadow-xl border-violet-200">
            <div class="flex items-start gap-4">
                <div
                    class="w-12 h-12 rounded-2xl bg-violet-100 flex items-center justify-center flex-shrink-0">
                    <img src="/static/img/logo.png" alt="Pokget" class="w-8 h-8">
                </div>
                <div class="flex-1">
                    <h4 class="text-base font-bold text-zinc-900 tracking-tight">Add to home screen</h4>
                    <p class="text-sm text-zinc-500 mt-1 leading-relaxed">Install Pokget as an app
                        for the fastest collection experience.</p>
                </div>
                <button @click="showPwaPrompt = false" class="btn-ghost min-h-11 px-2 -mr-2 -mt-1"
                    aria-label="Dismiss install prompt">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>

            <div class="mt-4 flex gap-3">
                <template x-if="!isIOS">
                    <button @click="
                        if (deferredPrompt) {
                            deferredPrompt.prompt();
                            deferredPrompt.userChoice.then((choiceResult) => {
                                if (choiceResult.outcome === 'accepted') {
                                    showPwaPrompt = false;
                                }
                                deferredPrompt = null;
                            });
                        }"
                        class="btn-primary flex-1">
                        Install now
                    </button>
                </template>

                <template x-if="isIOS">
                    <div class="flex-1 flex flex-col gap-3">
                        <div class="bg-zinc-100 rounded-xl p-3 flex items-center gap-3">
                            <span class="material-symbols-outlined text-violet-700 text-lg">ios_share</span>
                            <span class="text-xs font-semibold text-zinc-700">Tap Share</span>
                        </div>
                        <div class="bg-zinc-100 rounded-xl p-3 flex items-center gap-3">
                            <span class="material-symbols-outlined text-violet-700 text-lg">add_box</span>
                            <span class="text-xs font-semibold text-zinc-700">Add to Home Screen</span>
                        </div>
                        <button @click="showPwaPrompt = false"
                            class="btn-ghost self-center text-sm">I'll do it later</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        function openEditModalFromButton(button) {
            window.dispatchEvent(new CustomEvent('open-edit-modal', {
                detail: {
                    id: button.dataset.id,
                    notes: button.dataset.notes,
                    price: button.dataset.price,
                    grade: button.dataset.grade,
                    isPublic: button.dataset.public === 'true',
                    binderId: button.dataset.binderId,
                    trigger: button
                }
            }));
        }
    </script>
</body>

</html>
